# Bild bauen und nach ghcr.io veröffentlichen.
#
# Läuft bei jeder Fassung (Tag v*) und bei jedem Stand auf main. Gebaut wird
# für amd64 und arm64: übliche Server sprechen das eine, Macs und die
# günstigen ARM-Maschinen der Anbieter das andere.
name: Container-Bild

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Fremde Architektur bauen zu können, kostet einen Emulator
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Bei einem Pull Request wird nur gebaut, nicht veröffentlicht – dort
      # gibt es keine Berechtigung dafür, und es wäre auch falsch.
      - name: Anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v3.1.0 wird zu 3.1.0, 3.1, 3 und latest. Wer :3.1 einträgt, bekommt
      # Fehlerbehebungen, aber keinen Sprung auf 3.2.
      - name: Bezeichnungen bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ein Bild, das nicht startet, ist keins. Deshalb wird das frisch
      # gebaute einmal hochgefahren und gefragt, wie es ihm geht – auf der
      # Architektur des Läufers, ohne Emulator.
      - name: Probelauf
        if: github.event_name != 'pull_request'
        run: |
          docker build -t flatlink-probe --load .
          docker run -d --name probe -p 8080:80 \
            -e FLATLINK_BASE_URL=http://localhost:8080 flatlink-probe
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health | grep -q pass; then
              echo "Instanz antwortet"; exit 0
            fi
            sleep 2
          done
          echo "Instanz antwortet nicht:"; docker logs probe; exit 1
